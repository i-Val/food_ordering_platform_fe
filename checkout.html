<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout — Choply</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg py-3 site-nav">
      <div class="container">
        <a class="navbar-brand brand-mark" href="index.html">Choply</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <a href="cart.html" class="nav-link">Back to cart</a>
        </div>
      </div>
    </nav>

    <section class="checkout-section py-5">
      <div class="container">
        <div class="row g-5">
          <div class="col-lg-7">
            <h1 class="section-title">Delivery details</h1>
            <form class="auth-form" id="checkoutForm">
              <label class="auth-label" for="fullName">Full name</label>
              <input
                type="text"
                class="auth-input"
                id="fullName"
                placeholder="e.g. Ofure Momodu"
                required
              />

              <label class="auth-label" for="address">Delivery address</label>
              <input
                type="text"
                class="auth-input"
                id="address"
                placeholder="e.g. 12 Aso Drive, Abuja"
                required
              />

              <label class="auth-label" for="phone">Phone number</label>
              <input
                type="tel"
                class="auth-input"
                id="phone"
                placeholder="080X XXX XXXX"
                required
              />

              <label class="auth-label" for="paymentMethod"
                >Payment method</label
              >
              <select class="auth-input" id="paymentMethod" required>
                <option value="">Choose payment method</option>
                <option value="Cash on delivery">Cash on delivery</option>
                <option value="Card">Card</option>
                <option value="Bank transfer">Bank transfer</option>
              </select>

              <button type="submit" class="btn btn-stamp btn-lg auth-submit">
                Place order
              </button>
            </form>
          </div>

          <div class="col-lg-5">
            <h2 class="section-title">Order summary</h2>
            <div id="checkoutItems" class="cart-items mt-3"></div>
            <div class="cart-total-row mt-3">
              <span>Total</span>
              <span class="mono" id="checkoutTotal">₦0</span>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script>
      function getCart() {
        const cartData = localStorage.getItem("choplyCart");
        return cartData ? JSON.parse(cartData) : [];
      }

      function renderSummary() {
        const cart = getCart();
        const itemsDiv = document.getElementById("checkoutItems");
        const totalSpan = document.getElementById("checkoutTotal");

        if (cart.length === 0) {
          itemsDiv.innerHTML =
            '<p class="cart-empty">No items yet. <a href="menu.html">Browse the menu</a></p>';
          totalSpan.textContent = "₦0";
          return;
        }

        let html = "";
        let total = 0;

        cart.forEach(function (item) {
          const quantity = item.quantity || 1;
          total += item.price * quantity;
          html += `
        <div class="cart-row">
          <div class="cart-row-info">
            <h3>${item.name}</h3>
            <p>${item.restaurant}</p>
            <small>${item.customization || "Standard"} · Qty ${quantity}</small>
          </div>
          <div class="cart-row-meta">
            <span class="mono">₦${(
              item.price * quantity
            ).toLocaleString()}</span>
          </div>
        </div>
      `;
        });

        itemsDiv.innerHTML = html;
        totalSpan.textContent = "₦" + total.toLocaleString();
      }

      const checkoutForm = document.getElementById("checkoutForm");

      checkoutForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const cart = getCart();
        if (cart.length === 0) {
          alert("Your cart is empty — add something from the menu first.");
          return;
        }

        const token = localStorage.getItem("choplyToken");
        if (!token) {
          alert("Please log in before placing your order.");
          window.location.href = "login.html";
          return;
        }

        try {
          const response = await fetch("http://localhost:3000/api/orders", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              restaurantName: cart[0].restaurant,
              items: cart,
              fullName: document.getElementById("fullName").value,
              address: document.getElementById("address").value,
              phone: document.getElementById("phone").value,
              paymentMethod: document.getElementById("paymentMethod").value,
            }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok)
            throw new Error(data.error || "Unable to place order.");
          localStorage.removeItem("choplyCart");
          localStorage.setItem("choplyLastOrder", JSON.stringify(data));
          window.location.href = "confirmation.html";
        } catch (error) {
          if (/expired|invalid token|session expired/i.test(error.message)) {
            localStorage.removeItem("choplyToken");
            localStorage.removeItem("choplyUser");
            alert("Your session has expired. Please log in again.");
            window.location.href = "login.html";
            return;
          }
          alert(error.message);
        }
      });

      renderSummary();
    </script>
  </body>
</html>
