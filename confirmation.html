<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirming Order — Choply</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="confirm-page">

  <div class="confirm-card" id="verifyingState">
    <div class="spinner"></div>
    <p class="confirm-status">Verifying payment...</p>
  </div>

  <div class="confirm-card confirm-hidden" id="successState">
    <div class="stamp-circle">
      <span class="stamp-check">✓</span>
    </div>
    <h1 class="confirm-heading">Payment Successful</h1>
    <p class="confirm-status">Your order has been placed. Riders are already circling.</p>
    <a href="index.html" class="btn btn-stamp btn-lg mt-3">Back to home</a>
  </div>

</div>
<script>
  setTimeout(function () {
    const verifyingState = document.getElementById('verifyingState');
    const successState = document.getElementById('successState');

    verifyingState.classList.add('confirm-hidden');
    successState.classList.remove('confirm-hidden');
  }, 2000);
</script>
</body>
</html>
