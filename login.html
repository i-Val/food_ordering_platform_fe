<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Choply</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <a href="index.html" class="brand-mark auth-brand">Choply</a>
    <p class="eyebrow auth-eyebrow">WELCOME BACK</p>
    <h1 class="auth-heading">Log in to order.</h1>

    <form class="auth-form">
      <label class="auth-label" for="email">Email</label>
      <input type="email" class="auth-input" id="email" placeholder="you@example.com" required>

      <label class="auth-label" for="password">Password</label>
      <input type="password" class="auth-input" id="password" placeholder="Your password" required>

      <button type="submit" class="btn btn-stamp btn-lg auth-submit">Log in</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="signup.html">Sign up</a></p>
  </div>
</div>

</body>
</html>
