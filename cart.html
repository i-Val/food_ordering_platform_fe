<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — Choply</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar navbar-expand-lg py-3 site-nav">
  <div class="container">
    <a class="navbar-brand brand-mark" href="index.html">Choply</a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <a href="menu.html" class="nav-link">Back to menu</a>
    </div>
  </div>
</nav>

<section class="cart-section py-5">
  <div class="container">
    <h1 class="section-title">Your Cart</h1>

    <div id="cartItems" class="cart-items mt-4">
      </div>

    <div class="cart-total-row mt-4">
      <span>Total</span>
      <span class="mono" id="cartTotal">₦0</span>
    </div>

    <a href="checkout.html" class="btn btn-stamp btn-lg mt-4 w-100 text-center">Proceed to checkout</a>
  </div>
</section>
<script>
  function getCart() {
    const cartData = localStorage.getItem('choplyCart');
    return cartData ? JSON.parse(cartData) : [];
  }

  function saveCart(cart) {
    localStorage.setItem('choplyCart', JSON.stringify(cart));
  }

  function renderCart() {
    const cart = getCart();
    const cartItemsDiv = document.getElementById('cartItems');
    const cartTotalSpan = document.getElementById('cartTotal');

    if (cart.length === 0) {
      cartItemsDiv.innerHTML = '<p class="cart-empty">Your cart is empty. <a href="menu.html">Browse the menu</a></p>';
      cartTotalSpan.textContent = '₦0';
      return;
    }

    let html = '';
    let total = 0;

    cart.forEach(function (item, index) {
      total += item.price;
      html += `
        <div class="cart-row">
          <div class="cart-row-info">
            <h3>${item.name}</h3>
            <p>${item.restaurant}</p>
          </div>
          <div class="cart-row-meta">
            <span class="mono">₦${item.price.toLocaleString()}</span>
            <button class="cart-remove-btn" data-index="${index}">Remove</button>
          </div>
        </div>
      `;
    });

    cartItemsDiv.innerHTML = html;
    cartTotalSpan.textContent = '₦' + total.toLocaleString();

    const removeButtons = document.querySelectorAll('.cart-remove-btn');
    removeButtons.forEach(function (button) {
      button.addEventListener('click', function () {
        const indexToRemove = Number(button.getAttribute('data-index'));
        const cart = getCart();
        cart.splice(indexToRemove, 1);
        saveCart(cart);
        renderCart();
      });
    });
  }

  renderCart();
</script>
</body>
</html>
