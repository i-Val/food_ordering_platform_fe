<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart — Choply</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg py-3 site-nav">
      <div class="container">
        <a class="navbar-brand brand-mark" href="index.html">Choply</a>
        <div class="ms-auto d-flex align-items-center gap-3">
          <a href="menu.html" class="nav-link">Back to menu</a>
        </div>
      </div>
    </nav>

    <section class="cart-section py-5">
      <div class="container">
        <h1 class="section-title">Your Cart</h1>

        <div id="cartItems" class="cart-items mt-4"></div>

        <div class="cart-total-row mt-4">
          <span>Total</span>
          <span class="mono" id="cartTotal">₦0</span>
        </div>

        <a
          href="checkout.html"
          class="btn btn-stamp btn-lg mt-4 w-100 text-center"
          >Proceed to checkout</a
        >
      </div>
    </section>
    <a href="cart.html" class="cart-link" aria-label="Open cart">
      🛒 Cart <span id="cartCount" class="cart-badge">0</span>
      <span class="cart-particle cart-particle-one" aria-hidden="true"></span>
      <span class="cart-particle cart-particle-two" aria-hidden="true"></span>
      <span class="cart-particle cart-particle-three" aria-hidden="true"></span>
      <span class="cart-particle cart-particle-four" aria-hidden="true"></span>
      <span class="cart-particle cart-particle-five" aria-hidden="true"></span>
    </a>
    <script>
      function getCart() {
        const cartData = localStorage.getItem("choplyCart");
        return cartData ? JSON.parse(cartData) : [];
      }

      function saveCart(cart) {
        localStorage.setItem("choplyCart", JSON.stringify(cart));
      }

      function updateCartCount() {
        const cartLink = document.querySelector(".cart-link");
        const count = getCart().reduce(
          (total, item) => total + (item.quantity || 1),
          0,
        );
        document.getElementById("cartCount").textContent = count;
        cartLink.style.setProperty(
          "--cart-speed",
          `${Math.max(1.8, 7 - count * 0.35)}s`,
        );
        cartLink.classList.toggle("cart-empty", count === 0);
        syncCartParticles(count);
      }

      function syncCartParticles(itemCount) {
        const cartLink = document.querySelector(".cart-link");
        const particles = [...cartLink.querySelectorAll(".cart-particle")];
        const particleCount = Math.min(16, itemCount);
        while (particles.length < particleCount) {
          const particle = document.createElement("span");
          particle.className = "cart-particle cart-particle-extra";
          particle.style.left = `${15 + Math.random() * 70}%`;
          particle.style.top = `${15 + Math.random() * 70}%`;
          particle.style.setProperty(
            "--particle-x",
            `${Math.round(Math.random() * 60 - 30)}px`,
          );
          particle.style.setProperty(
            "--particle-y",
            `${Math.round(Math.random() * -45 - 12)}px`,
          );
          particle.style.animationDelay = `${(Math.random() * -4).toFixed(2)}s`;
          particle.style.animationDuration = `${(4 + Math.random() * 3).toFixed(
            2,
          )}s`;
          cartLink.appendChild(particle);
          particles.push(particle);
        }
        particles.forEach((particle, index) => {
          particle.style.display = index < particleCount ? "block" : "none";
        });
      }

      function flashCartState(state) {
        const cartLink = document.querySelector(".cart-link");
        cartLink.classList.remove("cart-added", "cart-removed");
        void cartLink.offsetWidth;
        cartLink.classList.add(state);
        setTimeout(() => cartLink.classList.remove(state), 850);
      }

      function renderCart() {
        const cart = getCart();
        updateCartCount();
        const cartItemsDiv = document.getElementById("cartItems");
        const cartTotalSpan = document.getElementById("cartTotal");

        if (cart.length === 0) {
          cartItemsDiv.innerHTML =
            '<p class="cart-empty">Your cart is empty. <a href="menu.html">Browse the menu</a></p>';
          cartTotalSpan.textContent = "₦0";
          return;
        }

        let html = "";
        let total = 0;

        cart.forEach(function (item, index) {
          const quantity = item.quantity || 1;
          total += item.price * quantity;
          html += `
        <div class="cart-row">
          <div class="cart-row-info">
            <h3>${item.name}</h3>
            <p>${item.restaurant}</p>
            <small>${item.customization || "Standard"}</small>
          </div>
          <div class="cart-row-meta">
            <span class="mono">₦${(
              item.price * quantity
            ).toLocaleString()}</span>
            <div class="cart-quantity-controls">
              <button class="cart-quantity-btn" data-index="${index}" data-change="-1" aria-label="Decrease quantity">−</button>
              <span>${quantity}</span>
              <button class="cart-quantity-btn" data-index="${index}" data-change="1" aria-label="Increase quantity">+</button>
            </div>
            <button class="cart-remove-btn" data-index="${index}" aria-label="Remove ${
            item.name
          } from cart">Remove item</button>
          </div>
        </div>
      `;
        });

        cartItemsDiv.innerHTML = html;
        cartTotalSpan.textContent = "₦" + total.toLocaleString();

        const quantityButtons = document.querySelectorAll(".cart-quantity-btn");
        quantityButtons.forEach(function (button) {
          button.addEventListener("click", function () {
            const index = Number(button.dataset.index);
            const change = Number(button.dataset.change);
            const cart = getCart();
            const nextQuantity = (cart[index].quantity || 1) + change;

            if (nextQuantity <= 0) {
              cart.splice(index, 1);
              flashCartState("cart-removed");
            } else {
              cart[index].quantity = Math.min(20, nextQuantity);
            }

            saveCart(cart);
            renderCart();
          });
        });

        const removeButtons = document.querySelectorAll(".cart-remove-btn");
        removeButtons.forEach(function (button) {
          button.addEventListener("click", function () {
            const indexToRemove = Number(button.getAttribute("data-index"));
            const cart = getCart();
            cart.splice(indexToRemove, 1);
            saveCart(cart);
            flashCartState("cart-removed");
            renderCart();
          });
        });
      }

      renderCart();
    </script>
  </body>
</html>
